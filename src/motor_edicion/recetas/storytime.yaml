# RECETA: STORYTIME / OPINIÓN HABLADA A CÁMARA
# Fórmula: la frase más fuerte de la historia (0-3 s) → historia sin silencios → giro → final abierto.
# Subtítulos protagonistas; casi sin efectos para no distraer de la voz.
duracion: {objetivo: 45, maximo: 90}
ritmo: {toma_max: 6.0, frase_max: 8.0, separacion_min: 0.2}
gancho: {estrategia: teaser, duracion: 2.5, transicion: corte}
seleccion:
  pesos: {voz: 2.0, palabras_clave: 1.5, movimiento: 0.3, color: 0.1}
  cobertura: 0
encuadre: {empuje_lento: 0.06}
transiciones: {rotacion: [corte]}
efectos: {zoom_en_picos: false}
subtitulos: {tam: 88, max_palabras: 2}
sfx: {activado: false}
