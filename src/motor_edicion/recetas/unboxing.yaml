# RECETA: UNBOXING / HAUL (Temu, Shein, AliExpress, Amazon…)
# Fórmula: gancho con el resultado (0-2 s) → apertura con sonidos ASMR → revelación con zoom
#          → reacción / precio → cierre que vuelve al inicio.
# Solo cambia lo que difiere de base.yaml.

duracion:
  objetivo: 30

ritmo:
  toma_max: 2.8
  acelerar_sin_voz: 1.15     # los tramos de abrir paquetes van un poco más rápido

gancho:
  estrategia: teaser
  duracion: 1.8
  transicion: flash

seleccion:
  pesos:
    picos: 1.1               # rasgar bolsas / abrir cajas = sonido característico del unboxing
    color: 0.6               # productos coloridos en pantalla
  palabras_clave: [wow, guau, mira, miren, qué, lindo, linda, bonito, bonita, hermoso, hermosa, temu,
                   precio, pesos, dólares, llegó, llegaron, abrir, abramos, increíble, amo, encanta,
                   dios, jaja, perfecto, calidad, barato, regalo, vale, pena]

transcripcion:
  contexto: "Unboxing de un pedido de Temu. Abriendo paquetes y mostrando productos."

audio:
  ganancia_sin_voz_db: 5     # el sonido de abrir paquetes es parte del atractivo (ASMR)

efectos:
  zoom_en_picos: true
  flash_en_reveal: true

transiciones:
  rotacion: [corte, corte, zoom, corte, whip, corte, corte, slide_arriba]
