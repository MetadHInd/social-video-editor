# ─────────────────────────────────────────────────────────────────────────────
# BASE RECIPE: defaults for every video (the other recipes override them)
# Each type recipe (unboxing.yaml, tutorial.yaml…) and each project.yaml
# ("settings" section) only overrides what it needs (deep merge).
# A value written as {es: …, en: …} is picked by `language`.
# ─────────────────────────────────────────────────────────────────────────────

language: es             # es | en — Whisper language, version folder names (v3SinMusica / v3NoMusic), default keywords

output:
  width: 1080            # 9:16 vertical; vertical video increases comments and shares (Xiao et al., 2024)
  height: 1920
  fps: 30                # export profiles (tiktok | reels | shorts | youtube | square): sve render --profile
  fade_in: 0             # seconds of fade from black at the start of the video (0 = off)
  fade_out: 0            # seconds of fade to black at the end (0 = off); the last frame is black

duration:
  target: 30             # seconds. <15 s competes on completion rate; 30 s+ on total watch time
  max: 60

pacing:
  shot_min: 0.8          # no shot is shorter (it becomes unreadable)
  shot_max: 3.2          # visual change every ~2-3 s (pattern interrupt)
  phrase_max: 5.0        # with speech, a shot may grow until the phrase ends
  min_gap: 0.6           # two shots from the same source never overlap
  speed_without_voice: 1.0   # 1.2 = shots without speech at 120 % speed

pauses:                  # sve plan: long pauses inside every shot with voice are shortened (domain/pauses.py)
  enabled: true
  min_pause: 0.9         # seconds: shorter pauses (breaths between sentences) are never cut
  keep_pause: 0.45       # seconds of pause left where a long one was cut
  silence_db: auto       # quieter than this (dBFS) is a pause; auto = 12 dB under the source median (≤ -25)
  min_span: 0.5          # no piece of speech shorter than this (the pause before it is kept instead)
  transition: soft_cut   # 0.12 s crossfade of sound and picture: the cut is neither heard nor seen

script:                  # explainer recipe: a script said to the camera (domain/script.py, script_align.py)
  file: script.md        # the script, in the project folder: sentences and [cues] (docs/PLAN_FORMAT.md)
  min_match: 0.6         # share of a sentence's words that must be heard for a take to count
  take: last             # last | best: which take is used when a sentence was said several times
  pad_start: 0.08        # seconds kept before the first word of a sentence
  pad_end: 0.12          # seconds kept after its last word
  join_gap: 0.6          # sentences said one after the other, this close, stay in one shot
  transition: dissolve   # how two camera shots are joined: dissolve = a 0.2 s crossfade (no dry jump cut) | cut
  cutaway_fade: 0.2      # seconds a full-frame graphic / clip fades in and out (two in a row: one over the other)
  punch_in: 1.08         # zoom alternated at every visible jump cut (0 = off)
  close_up: 1.15         # a third, closer framing: cuts go wide → punch-in → wide → close-up (0 = wide / punch-in only)
  subtitles: script      # script | speech: subtitles show the script's own words (timed by the voice), or what
                         # the transcription heard
  reframe_every: 4.0     # seconds: a longer shot is split between two sentences (nothing is lost) so the punch-in
                         # alternates there too; one camera reads like several (0 = off)
  drift: 0.04            # every camera shot zooms this much, slowly, while it plays (0 = off)
  support: true          # the engine proposes small notes around the presenter (callouts) where nothing else
                         # is on screen: figures, things with an illustration, key words
  auto_broll: false      # the director: footage (b-roll) where the presenter would stay alone on camera too long
  opening: 2.5           # seconds of face at the start before the first footage (the hook)
  max_camera: 4.0        # then, at most this many seconds of camera in a row
  auto_min: 1.8          # shortest footage the director proposes (time for a card to come in and be read)

pip:                     # picture-in-picture: the presenter stays in a window over full-frame cutaways
  enabled: false         # (a cutaway's own "pip": true / false wins)
  corner: bottom_right   # bottom_right | bottom_left | top_right | top_left
  size: 0.32             # window width as a share of the frame's short side
  min_seconds: 2.5       # shorter cutaways take the whole frame

hook:
  strategy: teaser       # teaser = show the best moment first (1-2 s), then tell the story | start = begin at the beginning
  duration: 1.6
  text: null             # big on-screen text during the first seconds (recommended). E.g. "Was it worth it? 😳"
  text_duration: null    # seconds the hook text stays on screen (null = only during the hook)
  transition: flash      # how the hook hands over to the story

cta:                     # closing call to action (product plans), drawn with the "cta" text style
  text: null             # e.g. "Link in bio 💕"
  duration: 6            # seconds at the end of the video

selection:               # how every moment of the footage is scored
  weights:
    motion: 1.0          # action on screen (moderate; too much is penalized as blur)
    audio: 0.7           # louder than usual
    peaks: 0.8           # sudden sounds: tearing, opening, laughs, "wow!"
    voice: 1.0           # someone is speaking
    keywords: 2.0        # a word from the list below is said
    sharpness: 0.6
    color: 0.4           # colorful image
  keywords: {es: [], en: []}
  min_brightness: 0.12   # drops almost black shots
  blur_percentile: 12    # drops the blurriest 12 %
  use_all_sources: true
  coverage: 8            # splits the footage in N parts and takes the best of each (0 = only the global best)

analysis:
  samples_per_sec: 4
  scene_threshold: 27

transcription:
  model: small           # tiny | base | small | medium | large-v3 (bigger = more accurate and slower)
  language: null         # null = same as `language`
  context: ""            # words that help Whisper (brands, names)
  min_probability: 0.35

color:
  auto: true
  per_source: false      # true = one correction measured over the whole recording (the same for all its shots)
  hdr_white: 0.62        # iPhone HDR → SDR conversion (tested)
  levels: true           # stretches blacks/whites
  white_balance: 0.5     # 0 = untouched, 1 = fully neutral
  target_luma: 0.47      # mean brightness ALL shots are brought to (matches them)
  gamma_min: 0.8
  gamma_max: 1.5
  contrast: 1.05
  saturation: 1.10
  vibrance: 0.12
  temperature: null      # e.g. 6000 = warmer
  fade: 0                # 0.1-0.2 = soft "matte" look: lifted blacks, softer whites
  tint: 0                # + = pink/magenta, - = green (-1…1; 0.3 = subtle)
  sharpen: 0.35          # CAS (0 = none)
  lut: null              # path to an optional creative .cube LUT
  vignette: false
  reference: null        # a video whose look to copy (path; relative to the project or workspace): brightness, blacks/whites, saturation, tint
  reference_strength: 1.0   # 0…1: how much of the reference look

framing:
  mode: auto             # auto | crop | blur (fills the borders with the same image blurred)
  focus_x: 0.5           # where to center the crop of a wider source (0 = left, 1 = right)
  focus_y: 0.5           # where to center the crop of a taller source (0 = top, 1 = bottom)
  zoom_margin: 1.25      # extra resolution so zooms keep their quality
  slow_push: 0.04        # "ken burns": every shot zooms 4 % (sense of motion)
  face: false            # false | auto | true: find the presenter's face and frame the shots on it (explainer plan);
                         # true may download a small face model once (≈230 KB), auto only uses one already there

transitions:
  rotation: [cut, cut, zoom, cut, whip, cut]   # used in this order
  duration: 0.22
  # catalog: cut | fade | soft_cut | dissolve | fade_black | flash | zoom | whip | slide_up | slide_left | circle | pixel | blur | radial | curtain

effects:
  zoom_on_peaks: true    # zoom punch on a loud sound (emphasis)
  zoom_scale: 1.12
  pulse_amount: 0.035    # beat_pulse effect: zoom on every beat
  zoom_ratio: 0.3        # at most 30 % of the shots get a zoom punch (overused, it loses its effect)
  flash_on_reveal: false
  progress_bar: false    # bar at the top that advances (anticipates the end)
  progress_bar_color: "#FFFFFF"

audio:
  use_original: true
  denoise: 10            # noise reduction (dB, afftdn). 0 = off
  clean_voice: false     # true = the background noise of each recording taken out ONCE, over the whole recording
                         # (RNNoise, a ≈300 KB model downloaded once): no seams at the cuts (then denoise is skipped)
  clean_mix: 1.0         # how much of the cleaned voice (1 = all; 0.8 keeps a little of the room)
  highpass: 80           # removes rumble
  voice_eq: true         # presence at 3 kHz, less "mud" at 250 Hz
  compressor: true
  gain_without_voice_db: 3   # raises ASMR sounds (tearing, opening) when nobody speaks
  asmr: false            # true = without speech: brighter, strong compression so every crackle is heard
  loudness: -14          # integrated LUFS (the most cited value for TikTok/Reels/Shorts)
  true_peak: -1.0        # dBTP
  master_max_gain_db: 24 # mastering never raises the audio more than this (warns if the target is not reached)
  drawn_shot_db: -6      # polaroid / collage: the sound continues from the source this much quieter

music:
  file: null             # path to an mp3/wav; null = first track of the music/ folder (or no music); none = no music
  volume_with_voice_db: -20
  volume_without_voice_db: -11
  ducking: true          # lowers the music automatically when someone speaks
  ducking_asmr: false    # also lowers it under the video sounds (ideal with asmr: true)
  ducking_ratio: 4
  start_at: 0.0          # second of the song to start from (e.g. the drop)
  fade_out: 1.0
  # start_at: auto       → the song starts so that its "drop" lands at the end of the first shot
  # drop_at: 2.0         → (optional) or at this exact second of the video
  # align: exact         → every cut EXACTLY on a beat (automatic if a shot has "beats": N)
  fade_in: 0.25
  cuts_on_beat: true     # moves the cuts to the nearest beat
  half_beats: true       # cutting between two beats (off-beat) is also fine
  bpm: null             # force the tempo (e.g. 120) when the detected one is wrong (sve music shows alternatives)
  tempo_factor: null    # 2 = double the detected tempo, 0.5 = half (detectors often pick half/double)

sfx:
  enabled: true
  volume_db: -12
  pop_on_texts: true     # pop when texts with the "pop" animation appear
  typing: true           # soft click for every letter of typed texts
  typing_db: -9          # relative to volume_db
  typing_max_per_sec: 16 # at most this many click sounds per second (letters still appear at their own speed)
  whoosh_on_transitions: true

subtitles:
  auto: true             # with speech → Whisper word by word; without speech → only the plan texts
  max_words: 3
  max_chars: 18
  uppercase: true
  font: Inter-Black
  size: 82
  color: "#FFFFFF"
  highlight: "#FFE14D"   # word being said
  stroke: 9
  stroke_color: "#000000"
  shadow: true
  y: 0.64                # vertical position (0 top, 1 bottom). TikTok safe zone ≈ 0.12–0.75
  animation: pop

texts:                   # styles of the plan's on-screen texts (hook, labels, cards, CTA…)
  # Style fields: size, font, color, background (#RRGGBBAA), x / y (center position, 0-1),
  # max_width, uppercase, radius (corners), outline, animation (typewriter | pop | none),
  # speed (letters per second when typing), desc_font / desc_size / desc_color (for "description").
  # A plan text may carry a "description": it is typed below the title once the title is done.
  styles:
    hook:    {size: 84, font: InterDisplay-Black, color: "#111111", background: "#FFFFFF", y: 0.20, max_width: 0.86, animation: typewriter, speed: 30}
    label:   {size: 64, color: "#FFFFFF", background: "#FF3B6B", y: 0.30, max_width: 0.8, animation: pop}
    card:    {size: 60, font: InterDisplay-Bold, color: "#2B2B2B", background: "#FFFFFFEB", y: 0.165, max_width: 0.88,
              radius: 0.5, animation: typewriter, speed: 34,
              desc_font: "Bradley Hand Bold", desc_size: 62, desc_color: "#D6457F"}
    counter: {size: 40, font: InterDisplay-Bold, color: "#FFFFFF", background: "#00000070", x: 0.86, y: 0.085,
              max_width: 0.3, radius: 0.7, animation: pop}
    price:   {size: 96, color: "#111111", background: "#FFE14D", y: 0.42, uppercase: true, max_width: 0.8, animation: pop}
    cta:     {size: 58, font: InterDisplay-Bold, color: "#FFFFFF", background: "#000000A8", y: 0.80, max_width: 0.84, animation: typewriter}
    simple:  {size: 72, color: "#FFFFFF", background: null, y: 0.50, max_width: 0.86, animation: pop}

export:
  crf: 17
  maxrate: 20M           # high quality so TikTok's re-encoding has headroom
  audio_kbps: 192
  cover: true            # also export a cover image (<name>_portada.jpg / <name>_cover.jpg)
  cover_at: 1.6          # second the cover is taken from (when the hook is already typed)

# render:               # (defaults in code; long videos, photo_crf…: see docs/PLAN_FORMAT.md)
#   jobs: auto           # video / photo shots encoded at once: auto (half the CPUs, 1-3) or 1-16; $SVE_JOBS
#                        # wins. Only the speed changes: the video is the same with any number of jobs.

check:                   # sve check <project>: automatic review of a render (thresholds)
  loudness_tolerance_lu: 1.0     # integrated loudness within ± this of audio.loudness (else error)
  silence_db: -50                # quieter than this (dBFS) …
  silence_sec: 0.5               # … for longer than this = silence
  cut_jump_lu: 8                 # loudness jump across a cut
  sfx_max_vs_mix_lu: -6          # sound effects at most mix − 6 LU
  music_max_vs_original_lu: 0    # audio.asmr: the music no louder than the original sound
  typing_max_per_sec: 20         # typing clicks per second
  typing_max_vs_mix_lu: -6       # typing clicks at most mix − 6 LU
  harsh_ratio: 0.35              # share of the energy in 2–5 kHz (whole video)
  harsh_window_ratio: 0.55       # … or in any 1 s window
  black_min_sec: 0.1             # black frames (fade_black transitions excluded)
  freeze_min_sec: 1.0            # frozen picture (polaroid, collage and freeze effects excluded)
  beat_tolerance_sec: 0.05       # median distance of the cuts to the beat
  safe_top: 0.06                 # text boxes inside [safe_top, safe_bottom] of the height
  safe_bottom: 0.78
  safe_right: 0.08               # and off the right 8 % (TikTok buttons) …
  right_rail: [0.35, 0.85]       # … in this part of the height (the four keys above: vertical/square output)
  # landscape output (width > height) uses a generic title-safe area instead (no app buttons):
  # 5 % top and sides, bottom at 0.90 (domain/check.py LANDSCAPE_SAFE)
  duration_tolerance: 0.25       # ± 25 % of duration.target
  listen_max: 6                  # ≤ 3 s snippets of the worst moments (listen/ or escuchar/)
  listen_sec: 3.0

review:                  # sve make: the engine reviews its own plan and render and fixes what it can (domain/review.py)
  rounds: 3              # at most this many renders (render → check → fix → render again)
  read_cps: 15           # characters a viewer reads per second: a graphic is shown at least its text / this
  graphic_max: 6.0       # seconds a full-frame graphic or photo stays at most; longer, the presenter comes back (0 = off)
  camera_slack: 1.5      # the presenter alone may run this much over script.opening / max_camera before it counts

polaroid:                # shot {"type": "polaroid", "from_shot": k, "beats": 2, "text": "…"}
  width: 0.70
  center_y: 0.5
  font: Bradley Hand Bold
  drop_time: 0.16        # seconds the photo takes to land
  flash: 0.10            # flash duration

collage:                 # shot {"type": "collage", "from_shots": [...], "background_from": k, "beats": 8}
  columns: 4
  subdivision: 2         # photos appear every 1/2 beat (4 = every quarter beat, faster)
  y0: 0.215              # vertical zone of the grid (inside the safe zone)
  y1: 0.72

vision:                  # local CLIP model: recognizes products by itself (optional extra: pip install 'social-video-editor[vision]')
  enabled: auto          # auto = used when installed and already downloaded | true = may download it (≈1.2 GB, once) | false
  model: sentence-transformers/clip-ViT-B-32                         # images
  text_model: sentence-transformers/clip-ViT-B-32-multilingual-v1    # texts in Spanish, English and 50+ languages
  device: cpu            # cpu | mps (Apple GPU, opt-in) | cuda
  fps: 2                 # frames per second embedded (from the proxy; cached in cache/<id>_clip.npy)
  positive:              # what a product shot looks like…
    es: ["un producto sostenido en la mano, primer plano", "a product held in a hand, close-up",
         "un accesorio pequeño mostrado a la cámara", "a small accessory shown to the camera"]
    en: ["a product held in a hand, close-up", "a small accessory shown to the camera"]
  negative:              # …and what it does not
    es: ["bolsa de envío de plástico gris", "a gray plastic shipping bag", "manos abriendo un paquete",
         "hands opening a package", "imagen borrosa", "a blurry photo"]
    en: ["a gray plastic shipping bag", "hands opening a package", "a blurry photo"]
  weights: {prompts: 0.5, objectness: 1.0, novelty: 1.0, sharpness: 0.5}   # parts of the product score (domain/products.py)
  min_score: 0.35        # standardized product score where a product starts (higher = fewer, surer products)
  extend_score: -0.25    # score the frames around it need to belong to the same product
  continuity: 0.78       # similarity between consecutive frames below which a new product starts
  min_duration: 1.0      # seconds a product must be visible
  max_duration: 25.0     # a product segment never grows longer
  same_product: 0.82     # two stretches this similar (and < 20 s apart) are the same product: merged
  window: 2.0            # seconds of the best moment of each product
  unpacked: 0            # >0 (e.g. 2): prefer the moment the product is out of its box/wrapper
  packaging: ["a cardboard product box", "a clear plastic wrapper with a barcode label"]   # what packaging looks like (English: CLIP)
  max_products: 15
  stars: 3               # the most confidently recognized products get a fast→slow ramp + polaroid
  cards: true            # product plan: a card with each product's proposed name
  counters: true         # product plan: an n/N counter on each product
  collage: true          # product plan: a collage of every product at the end
  product_effect: beat_pulse   # effect on each product shot (null = none)
  opening_max: null      # seconds of the package-opening shot (null = pacing.shot_max)
  vocabulary: null       # null = packaged list of ~80 small products (es/en); or your own list of names
  product_plan: false    # plan = one shot per detected product (the unboxing recipe turns it on)
  product_search: false  # true = "search" with criterion "product" uses the vision model (changes the windows
                         # of existing plans, so it is opt-in); "search" by "text" always uses it

broll:                   # sve broll: third-party clips for the [broll query="…"] cues (domain/footage.py)
  sources: [official, pexels, pixabay, wikimedia]   # tried in this order; official = a listed brand's own channel
  candidates: 2          # clips downloaded per cue; the vision model keeps the one that shows the query best
  search_limit: 12       # results asked of each source
  max_seconds: {official: 5, stock: 8}   # longest a clip of each kind stays on screen
  max_share: {official: 0.15}            # share of the video official-channel footage may take (sve check)
  credit: true           # a caption with the author / brand the first time each one is on screen
  credit_seconds: 3
  min_height: 720        # short side, pixels: smaller clips are not used
  max_megabytes: 250     # heavier files are not downloaded
  licenses: [cc0, pd, cc-by, cc-by-sa]   # accepted from Wikimedia Commons (the stock libraries have their own)
  framing: crop          # crop | blur | auto: how a clip of another shape fills the frame
  fallback_card: true    # when no clip passes the checks: the engine draws one instead (a scene, a figure, a list or a
                         # title with what is said)
  min_interest: 0.05     # how alive a clip must look (vision: something happening vs a backdrop; 0 = any)
  thumbnails: 8          # candidates judged by their still before any video is downloaded
  lively: ["a close-up of hands using a smartphone", "a person interacting with a device",
           "a dynamic shot of technology in action", "a product shown in motion"]
  dull: ["an abstract background", "a static wallpaper", "a store front", "a still image with nothing happening",
         "a blurry photo"]
  min_match: 0.27        # vision score below which a clip does not show the query or the sentence (unrelated ≈0.22,
                         # right ≈0.28);
                         # without the vision model clips are not judged
  text: false            # true = clips that show printed text (titles, captions) may be used; false = they are
                         # avoided: the piece and the crop with no text are chosen, a clip with text everywhere is skipped
  preview_minutes: 12    # videos longer than this are not looked through (any source)
  brands: []             # [{name: Brand, channel_id: UC…, aliases: [product names]}]; a pack's brands.yaml adds to it

graphics:                # shots {"type": "graphic", "template": "bars", …} — animated graphics drawn from data
  pack: null             # name of a pack (<workspace>/packs/<name>/pack.yaml): a channel's look and drawings
  theme: {}              # overrides of the theme on top of the pack (colors, fonts, strokes… see docs/GRAPHICS.md)
