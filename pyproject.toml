[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-video-editor"
version = "0.3.0"
description = "Video editing engine for social media: vertical clips and landscape photo slideshows (Python + FFmpeg)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
    "pillow",
    "soundfile",
    "scipy",
    "librosa",
    "opencv-python",
    "scenedetect",
    "faster-whisper",
]

[project.optional-dependencies]
vision = ["sentence-transformers"]
music = ["yt-dlp"]
enhance = ["spandrel", "torch"]
dev = ["pytest"]

[project.scripts]
sve = "social_video_editor.cli:main"
social-video-editor = "social_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_video_editor = ["recipes/*.yaml", "data/vocabulary/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # works even when the package is not installed
markers = ["integration: needs FFmpeg (generates synthetic media in a temporary folder)",
           "vision: needs the CLIP model already downloaded (skipped otherwise)",
           "enhance: needs spandrel + torch and the Real-ESRGAN model file (skipped otherwise)"]
