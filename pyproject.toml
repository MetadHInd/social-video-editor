[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-video-editor"
version = "0.2.0"
description = "Vertical video editing engine for social media (Python + FFmpeg)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
    "pillow",
    "soundfile",
    "scipy",
    "librosa",
    "opencv-python",
    "scenedetect",
    "faster-whisper",
]

[project.optional-dependencies]
vision = ["sentence-transformers"]
music = ["yt-dlp"]
dev = ["pytest"]

[project.scripts]
sve = "social_video_editor.cli:main"
social-video-editor = "social_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_video_editor = ["recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # works even when the package is not installed
markers = ["integration: needs FFmpeg (generates synthetic media in a temporary folder)"]
