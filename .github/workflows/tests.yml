name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (rules in pyproject.toml)
        run: ruff check --output-format=github .

  pytest:
    name: pytest (Python ${{ matrix.python-version }}, FFmpeg 7)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Debian 13 images: FFmpeg 7.1 from apt (the engine needs FFmpeg >= 7; Ubuntu 24.04 ships 6.1)
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PIP_CACHE_DIR: /tmp/pip-cache
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"          # never download Whisper / CLIP models: those tests skip or degrade
    steps:
      - name: System packages (FFmpeg, Rubber Band, OpenCV libs, fonts)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ffmpeg rubberband-cli libgl1 libglib2.0-0 \
            fonts-inter fonts-dejavu-core fonts-liberation2 fonts-noto-color-emoji fontconfig
          ffmpeg -hide_banner -version | head -n 1

      - uses: actions/checkout@v4

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: /tmp/pip-cache
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-

      # Only the base package + dev tools: the heavy extras (torch, spandrel, sentence-transformers)
      # are not installed and their tests skip.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (unit + integration)
        run: python -m pytest -q -rs

